[tools]
"cargo:cargo-zigbuild" = "0.23.0"
zig = "0.16.0"
"github:EmbarkStudios/cargo-deny" = "0.20.2"
"github:kbknapp/cargo-outdated" = "0.19.0"
"github:rhysd/actionlint" = "v1.7.12"
"github:rustsec/rustsec" = "cargo-audit/v0.22.2"
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.140"
"aqua:1password/cli" = "2.35.0"
"aqua:BurntSushi/ripgrep" = "15.2.0"
"github:yonaskolb/XcodeGen" = "2.46.0"

[settings]
idiomatic_version_file_enable_tools = ["rust"]
lockfile = true

[tasks.ci]
run = "cargo check --workspace --all-targets --locked"

[tasks.test]
run = "cargo nextest run -p tablerock-core -p tablerock-persistence -p tablerock-tui -p tablerock-cli -p tablerock-ffi --locked"

[tasks.lint]
run = "cargo clippy --workspace --all-targets --locked -- -D warnings"

[tasks.fmt]
run = "cargo fmt --all -- --check"
