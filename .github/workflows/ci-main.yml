    name: ci-required
    if: ${{ always() }}
    needs: [plan, policy, github-rust-policy, github-rust-tablerock-cli, github-rust-tablerock-core, github-rust-tablerock-engine, github-rust-tablerock-ffi, github-rust-tablerock-files, github-rust-tablerock-persistence, github-rust-tablerock-tools, github-rust-tablerock-tui, github-swift-package-native, github-swift-xcodeproj-tablerock]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate generated stack results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          SELECTED_UNITS: ${{ needs.plan.outputs.units }}
          FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          result_for_job() {
            jq -r --arg job "$1" '.[$job].result // empty' <<<"$NEEDS_JSON"
          }
          result="$(result_for_job plan)"
          if [[ "$result" != success ]]; then
            echo "required CI prerequisite plan did not pass: $result" >&2
            exit 1
          fi
          result="$(result_for_job policy)"
          if [[ "$result" != success ]]; then
            echo "required CI prerequisite policy did not pass: $result" >&2
            exit 1
          fi
          selected=",$SELECTED_UNITS,"
          if [[ "$selected" == *",rust-policy,"* ]]; then
            result="$(result_for_job github-rust-policy)"
            case "$result" in
              success) ;;
              *) echo "selected CI job github-rust-policy did not pass: $result" >&2; exit 1 ;;
            esac
          else
            result="$(result_for_job github-rust-policy)"
            case "$result" in
              success|skipped) ;;
              *) echo "unselected CI job github-rust-policy failed unexpectedly: $result" >&2; exit 1 ;;
            esac
          fi
          if [[ "$selected" == *",rust-tablerock-cli,"* ]]; then
            result="$(result_for_job github-rust-tablerock-cli)"
