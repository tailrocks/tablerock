    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate generated stack results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          SELECTED_UNITS: ${{ needs.plan.outputs.units }}
          LANE_ADMITTED_GITHUB: ${{ github.event_name == 'pull_request' || (github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule')) || (github.event_name == 'workflow_dispatch' && (github.event.inputs.runner == 'github' || github.event.inputs.runner == 'both' || github.event.inputs.runner == '')) }}
        shell: bash
        run: |
          set -euo pipefail
          result_for_job() {
            jq -r --arg job "$1" '.[$job].result // empty' <<<"$NEEDS_JSON"
          }
          result="$(result_for_job plan)"
          if [[ "$result" != success ]]; then
            echo "required CI prerequisite plan did not pass: $result" >&2
            exit 1
          fi
          result="$(result_for_job policy)"
          if [[ "$result" != success ]]; then
            echo "required CI prerequisite policy did not pass: $result" >&2
            exit 1
          fi
          selected=",$SELECTED_UNITS,"
          if [[ "$selected" == *",rust-policy,"* ]]; then
            result="$(result_for_job github-rust-policy)"
            if [[ "$LANE_ADMITTED_GITHUB" == true ]]; then
              case "$result" in
                success) ;;
                *) echo "selected CI job github-rust-policy did not pass: $result" >&2; exit 1 ;;
              esac
            else
              case "$result" in
                skipped) ;;
                *) echo "selected CI job github-rust-policy ran outside its lane admission (LANE_ADMITTED_GITHUB=$LANE_ADMITTED_GITHUB): $result" >&2; exit 1 ;;
              esac
            fi
