case \"${snap#s256-}\" in *[!0-9a-f]*) snap= ;; esac; if [ -z \"$snap\" ]; then rm -f \"$RUNNER_TEMP/velnor/state-discovery.record\"; printf '\\''%s\\n'\\'' '\\''reason=snapshot_missing'\\'' '\\''save=false'\\'' '\\''restore=false'\\'' >> \"$GITHUB_OUTPUT\"; printf '\\''%s\\n'\\'' '\\''velnor: state snapshot disabled reason=snapshot_missing'\\''; exit 0; fi; restore_prefix=\"velnor-v4-state-trusted-union-root-$compat-\"; snapshot_prefix=\"$restore_prefix$snap-\"; key=\"$snapshot_prefix\"; [ \"${#key}\" -le 443 ] || { printf '\\''cache key exceeds the GitHub cap: %s\\n'\\'' \"$key\" >&2; exit 1; }; save=false; [ \"$trust\" != trusted ] || save=true; if [ \"$trust\" = trusted ]; then provenance=trusted; decision=admitted; else case \"${GITHUB_EVENT_NAME:-}\" in pull_request) provenance=untrusted ;; *) provenance=ambiguous ;; esac; decision=restore-only; fi; restore_key=; restore_digest=; exact=false; printf '\\''%s\\n'\\'' \"${VELNOR_STATE_ATTESTED-}\" > \"$d/attested\"; while IFS= read -r cand || [ -n \"$cand\" ]; do case \"$cand\" in \"$restore_prefix\"?*) ;; *) continue ;; esac; if printf '\\''%s\\n'\\'' \"${cand#\"$restore_prefix\"}\" | grep -Eq '\\''^s256-[0-9a-f]{64}-s256-[0-9a-f]{64}$'\\''; then restore_key=$cand; break; fi; done < \"$d/attested\"; if [ -n \"$restore_key\" ]; then restore_digest=\"s256-${restore_key##*-s256-}\"; case \"$restore_key\" in \"$snapshot_prefix\"?*) exact=true ;; esac; fi; printf '\\''%s\\n'\\'' \"key=$key\" \"save=$save\" \"restore=true\" \"provenance=$provenance\" \"decision=$decision\" \"restore_key=$restore_key\" \"restore_digest=$restore_digest\" \"exact=$exact\" >> \"$GITHUB_OUTPUT\"; record=\"$RUNNER_TEMP/velnor/state-discovery.record\"; printf '\\''%s\\n'\\'' \"key=$key\" \"snapshot_prefix=$snapshot_prefix\" \"restore_prefix=$restore_prefix\" \"compat=$compat\" \"provenance=$provenance\" \"decision=$decision\" \"save=$save\" \"unit=union\" \"mbx_version=${VELNOR_MBX_BUNDLE_VERSION}\" \"toolchain=${VELNOR_MBX_BUNDLE_TOOLCHAIN}