        run: mise --no-config --no-env --no-hooks install rust@1.97.1 mr-boxington@1.30.0 actionlint@1.7.12 shellcheck@0.11.0 zizmor@1.30.1 aqua:nextest-rs/nextest/cargo-nextest@0.9.148
      - name: Prepare Rust components
        env:
