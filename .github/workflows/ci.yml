          path: ${{ runner.temp }}/velnor/r${{ github.run_id }}-a${{ github.run_attempt }}
      - name: Prepare pinned tools
        env:
          MISE_CARGO_HOME: ${{ runner.temp }}/velnor/cargo
          MISE_RUSTUP_HOME: ${{ runner.temp }}/velnor/rustup
        run: mise --no-config --no-env --no-hooks install rust@1.97.1 actionlint@1.7.12 shellcheck@0.11.0 zizmor@1.30.1 aqua:nextest-rs/nextest/cargo-nextest@0.9.148
      - name: Prepare Rust components
        env:
          CARGO_HOME: ${{ runner.temp }}/velnor/cargo
          MISE_CARGO_HOME: ${{ runner.temp }}/velnor/cargo
          MISE_RUSTUP_HOME: ${{ runner.temp }}/velnor/rustup
          RUSTUP_HOME: ${{ runner.temp }}/velnor/rustup
        run: mise --no-config --no-env --no-hooks exec rust@1.97.1 -- rustup component add --toolchain 1.97.1-x86_64-unknown-linux-gnu clippy rustfmt
