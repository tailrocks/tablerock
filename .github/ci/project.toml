[[unit]]
id = "swift-xcodeproj-tablerock"
label = "Apple scheme (TableRock)"
kind = "swift"
root = "native/App"
watch = ["*.xcconfig", "native/App/**", "native/App/TableRock.xcodeproj/**"]
pr_commands = ["mise run ffi:xcframework", "cd -- 'native/App' && xcodebuild -project 'TableRock.xcodeproj' -scheme 'TableRock' CODE_SIGNING_ALLOWED=NO build", "cd -- 'native/App' && xcodebuild -project 'TableRock.xcodeproj' -scheme 'TableRock' CODE_SIGNING_ALLOWED=NO test"]
full_commands = ["mise run ffi:xcframework", "cd -- 'native/App' && xcodebuild -project 'TableRock.xcodeproj' -scheme 'TableRock' CODE_SIGNING_ALLOWED=NO build", "cd -- 'native/App' && xcodebuild -project 'TableRock.xcodeproj' -scheme 'TableRock' CODE_SIGNING_ALLOWED=NO test"]
depends_on = ["rust-tablerock-ffi"]
platform = "macos-arm64"
trust = "untrusted-ok"
[unit.capabilities]
docker = false
nested_privileged_docker = false
buildx_compose = false
testcontainers = false
services_with_readiness = false
browser_binaries = false
native_macos_arm64 = true
[unit.cache]
key_files = [".swift-version", ".xcode-version", "mise.lock", "native/App/TableRock.xcodeproj/project.pbxproj", "native/App/TableRock.xcodeproj/xcshareddata/xcschemes/TableRock.xcscheme"]
paths = ["~/Library/Developer/Xcode/DerivedData"]
